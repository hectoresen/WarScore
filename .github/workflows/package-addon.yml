name: Validate installable WarScore source folder

on:
  push:
    branches: [main]
    paths:
      - 'addon/WarScore/**'
      - 'tools/**'
      - '.github/workflows/package-addon.yml'
  pull_request:
    paths:
      - 'addon/WarScore/**'
      - 'tools/**'
      - '.github/workflows/package-addon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check WarScore source folder is ready to copy into AddOns
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import importlib.util
          import re

          repo = Path.cwd()
          root = repo / "addon" / "WarScore"
          assert root.is_dir(), "Missing addon/WarScore folder"
          toc = root / "WarScore.toc"
          assert toc.is_file(), "Missing WoW TOC manifest"
          # The existing package manifest resolver already knows all static
          # texture references, dynamic rank fills and font dependencies.
          # Import source_files without executing the ZIP entrypoint.
          spec = importlib.util.spec_from_file_location("war_score_files", "tools/package_addon.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          required = module.source_files()
          assert required, "No runtime files found"
          assert all((root / path).is_file() for path in required)
          assert any(str(p) == "UI/General.lua" for p in required)
          assert any(str(p) == "UI/Minimap.lua" for p in required)
          ui = (root / "UI/General.lua").read_text(encoding="utf-8")
          assert re.search(r'^local UI_ITERATION = "[0-9]+"
          assert 'local duelIconReduction = not secondary and i == 1 and ownerTopIcon and 0.86 or 1' in ui
          assert 'honorPanel:SetPoint("TOP", window, "TOP", 0, -516)' in ui
          textures = [path for path in required if path.suffix.lower() == ".tga"]
          for path in textures:
              with Image.open(root / path) as image:
                  image.verify()
          print(f"Validated copy-ready addon/WarScore: {len(required)} required files, {len(textures)} TGA assets")
          PY
, ui, re.MULTILINE), "Missing numeric UI iteration"
          assert 'local duelIconReduction = not secondary and i == 1 and ownerTopIcon and 0.86 or 1' in ui
          assert 'honorPanel:SetPoint("TOP", window, "TOP", 0, -516)' in ui
          textures = [path for path in required if path.suffix.lower() == ".tga"]
          for path in textures:
              with Image.open(root / path) as image:
                  image.verify()
          print(f"Validated copy-ready addon/WarScore: {len(required)} required files, {len(textures)} TGA assets")
          PY
