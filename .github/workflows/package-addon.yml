name: Package clean WarScore addon
on:
  push:
    branches: [main]
    paths:
      - 'WarScore.toc'
      - 'Core/**'
      - 'UI/**'
      - 'Media/**'
      - 'tools/package_addon.py'
      - '.github/workflows/package-addon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build standard ZIP and verify contents
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_addon.py
          unzip -t dist/WarScore.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p = Path("dist/WarScore.zip")
          with ZipFile(p) as z:
              names = z.namelist()
              assert len(names) == 15, f"Unexpected file count: {len(names)}"
              assert all(n.startswith("WarScore/") for n in names)
              assert all(not any(part in n.lower() for part in ["openspec", "docs/", "tools/"]) for n in names)
              assert z.testzip() is None
          print("Verified installable WarScore ZIP:", p.stat().st_size, "bytes")
          PY
      - name: Commit verified distribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/WarScore.zip
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh verified WarScore ZIP [skip ci]"
            git push
          fi
