name: Build Classic Forever Simple artwork

on:
  push:
    branches:
      - feat/visual-style-system
    paths:
      - 'docs/assets/simple/**'
      - 'scripts/build_simple_assets.py'
      - '.github/workflows/build-simple-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    if: github.repository == 'hectoresen/WarScore' && github.ref == 'refs/heads/feat/visual-style-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visual-style-system
          persist-credentials: true
      - name: Build WoW-compatible textures
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/build_simple_assets.py
          test -s addon/WarScore/Media/General/simple_rank_plaque_owner.tga
          test -s addon/WarScore/Media/General/simple_divider_diamond_owner.tga
          test -s addon/WarScore/Media/General/simple_divider_thin_owner.tga
      - name: Commit generated TGA files to feature branch
        run: |
          set -euo pipefail
          git add addon/WarScore/Media/General/simple_rank_plaque_owner.tga
          git add addon/WarScore/Media/General/simple_divider_diamond_owner.tga
          git add addon/WarScore/Media/General/simple_divider_thin_owner.tga
          if git diff --cached --quiet; then
            echo "Textures already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(assets): include original Simple TGA textures"
          git push origin HEAD:feat/visual-style-system
