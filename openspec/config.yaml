schema: spec-driven
context: |
  WarScore is an active native offline Lua addon for World of Warcraft Forever,
  Interface 16001. Its public README describes the current functionality.
  Source of truth is addon/WarScore/, especially Core/Stats.lua,
  Core/Localization.lua, UI/General.lua and UI/Minimap.lua.
  Evidence about native APIs and semantics is in docs/PVP_STATISTICS.md.
  The ornate visual target is documented in docs/GENERAL_VIEW.md and
  docs/GENERAL_VISUAL_SPEC.md. Read AGENTS.md and openspec/README.md.
  Do not conflate old iterations with the current release. Never fabricate
  APIs, screenshots, test results, owner acceptance or historical metrics.
  Use official OpenSpec CLI validation and archival; preserve the approval gate.
rules:
  proposal:
    - State goal, scope, exclusions, risks, available evidence and explicit approval status.
    - For retrospective documentation, label the reconstruction and its evidence.
  specs:
    - Use testable SHALL requirements with WHEN/THEN scenarios.
    - Cover unsupported APIs, missing values and UI compatibility.
  design:
    - Describe Lua module boundaries, data contracts, assets and compatibility tests.
  tasks:
    - Distinguish implemented, offline verified, in-client verified, and NOT RUN.
    - Do not mark owner acceptance or command execution complete without evidence.
    - Archive only after evidence review, approval and actual CLI validation.
